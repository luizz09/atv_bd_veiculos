<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/cad_veiculo.js" defer></script>
    <title>Cadastro veículo</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Principal</a>
            <a href="./cad_veiculo.html">Cadastrar Veículos</a>
            <a href="./list_veiculo.html">Listar veículos</a>
        </nav>
    </header>
    <main>
        <h1>Cadastro de veículo</h1>
        <br>
            <label for="nome">Nome do veículo:</label><br>
            <input type="text" id="nome"><br><br>
            <label for="marca">Marca:</label><br>
            <input type="text" id="marca"><br><br>
            <p>Selecione a categoria:</p>
            <select id="categoria">
                <option value="popular">Popular</option>
                <option value="sedan">Sedan</option>
                <option value="luxo">Luxo</option>
            </select><br><br>
            <label for="ano">Ano:</label><br>
            <input type="text" id="ano"><br><br>
            <label for="precoFabrica">Preço de fábrica:</label><br>
            <input type="text" id="precoFabrica"><br><br>
            <button id="cad_usuario">Cadastrar</button><br><br>
        <div id="resposta"></div>
    </main>
</body>
</html>
